<script>
(()=>{
 const root=document.getElementById('rye-motion');
 const menu=root.querySelector('.rye-menu-view'),destination=root.querySelector('.rye-destination'),items=[...root.querySelectorAll('.rye-menu-item')];
 const content=root.querySelector('.rye-page-content'),wipe=root.querySelector('.rye-transition'),burst=root.querySelector('.rye-burst'),motionButton=root.querySelector('.rye-motion-control');
 const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
 let selected=0,busy=false,motion=!reduced.matches,topicOrigin=null,introTimer,pageTimer,currentTopic=null,topicTrail=[],activeInterest=0,chapterObserver;
 const sections=[
  {title:'关于我',en:'ABOUT ME',note:'一段关于迷茫、选择和行动的自我介绍。'},
  {title:'行动与思考',en:'TRY / THINK',note:'认知、环境、房子、工作与恋爱关系，分开阅读。'},
  {title:'兴趣宇宙',en:'OTHER WORLDS',note:'故事、作品，还有那些尚未探索的兴趣。'},

  {title:'工具与项目',en:'MAKE / SHARE',note:'用 AI 和工具，把想法带到现实里。'}
 ];
 const topics=[{"id":"cognition","title":"认知","note":"几个容易听懂，却不容易内化的想法","html":"\n              <span class=\"note-index\">01 / 认知</span>\n              <h2>几个容易听懂，却不容易内化的想法</h2>\n              <p>大三的时候，开始走此前没准备过的游戏策划路线。看了课代表立正不少视频和课程，其中几个想法对当时的我起了作用：拥抱不确定性、成长型思维、主体思维、行动引领思考。</p>\n              <p>这些东西很容易听懂，但碰到自己的事，还是不容易用上。</p>\n              <section class=\"note-subsection\" id=\"cognition-uncertainty\" aria-labelledby=\"cognition-uncertainty-title\">\n                <h3 id=\"cognition-uncertainty-title\">拥抱不确定性：宝藏在迷雾中</h3>\n                <p>学生时代，考什么、学什么，大多有人告诉我们。从中小学开始，一直在考试中获得成绩，好像只要埋头读书就可以了。习惯了有考题、有范围，也有比较明确的评价。</p>\n                <p>但到了社会，没有人会给你出考题，得自己去找。想做什么、往哪走，也没有一个标准答案。</p>\n                <p>宝藏在迷雾中。有些机会，开始尝试以后才看得见。读《伟大为什么不能被计划》时，里面关于计划的讨论，也让我重新想了想这件事。</p>\n                <p>就拿这个网站来说。没做过并上线过网站，不知道能不能用 AI 做出符合我品味的动画和交互，也不知道最后能带来什么确定的东西。或许大家根本不想认识我，或许我的经验无法帮助任何人。有一万个理由否定做个人网站的想法。</p>\n                <p>网站就是在这些问题还没有答案的时候，开始做的。</p>\n              </section>\n              <section class=\"note-subsection\" id=\"cognition-growth\" aria-labelledby=\"cognition-growth-title\">\n                <h3 id=\"cognition-growth-title\">成长型思维：现在不会，还可以学</h3>\n                <p>当时不清楚游戏策划要做什么，只有不到一年就要实习了，换方向怎么看都有点晚。如果觉得能力就这样了，学不了多少东西，那这条路根本不会去走。</p>\n                <p>《刻意练习》让我关注到，学习也有方法。不会的东西，可以拆开练，可以找反馈，再改。现在做不到和以后学不会，中间还隔着一个学习的过程。</p>\n                <p>关注付出，也关注这次到底学到了什么。一次结果不好，可能有很多原因，至少不用立刻变成“我就是不行”。练了没变化，也得看看方法有没有问题。</p>\n                <p>遇到挑战时，注意力能放到能学到什么上面，很多事情才有继续尝试的空间。</p>\n              </section>\n              <section class=\"note-subsection\" id=\"cognition-agency\" aria-labelledby=\"cognition-agency-title\">\n                <h3 id=\"cognition-agency-title\">主体思维：选择还是得自己来做</h3>\n                <p>老师讲过十几年前计算机专业的就业机会，再看现在，已经是另一回事。环境会变，选了一个当时看起来不错的专业，也保证不了以后的路。</p>\n                <p>环境不好会影响机会，这个影响确实存在。但如果一直停在抱怨上，等社会环境变好，自己能做的事也就一直没做。</p>\n                <p>以前想做什么，学校、家长都会告诉我们该怎么选。习惯了听安排，后来连需要自己判断的东西，也一起交出去了。</p>\n                <p>可最后，做这份工作、过这种生活的，还是自己。建议可以听，选择还是得自己来做。</p>\n                <p>大三转向游戏策划，就是开始走自己的路。和周围一些人的方向不一样，当时也没法证明这一定是个好选择。</p>\n              </section>\n              <section class=\"note-subsection\" id=\"cognition-action\" aria-labelledby=\"cognition-action-title\">\n                <h3 id=\"cognition-action-title\">行动引领思考：有些东西，做了才知道</h3>\n                <p>网站最后能做成什么样，大家会不会喜欢，光想很难有答案。代码能呈现什么效果，AI 能帮到什么程度，也得实际用起来才能了解。</p>\n                <p>有了能看的版本，喜欢哪里、不喜欢哪里，才有具体的东西可以讨论。想法也会跟着变，原来没想到的问题会冒出来。</p>\n                <p>很多思考需要这些实际接触到的东西。一直没开始，就只能围着原来的想象打转。</p>\n              </section>\n              <section class=\"note-subsection\" id=\"cognition-learning\" aria-labelledby=\"cognition-learning-title\">\n                <h3 id=\"cognition-learning-title\">想获得想要的成果，就去找已经获得成果的人学习</h3>\n                <p>有些东西，不用全靠自己从头摸索。已经有人走过这条路，做出过成果，可以看看他们具体做了什么，哪些地方值得学。</p>\n                <p>只看结果，很容易觉得对方厉害、自己做不到。再往前看一点，才有可能看到那些能学的东西。</p>\n                <p>当然，起点、条件、时机都可能不一样。能学到做法，不代表能复制结果。</p>\n              </section>\n              <p>最后打个预防针，事物是很多维的，这里只摘了一部分对我比较重要的东西。也还在慢慢内化，有想讨论的可以联系我。</p>\n            ","chapters":[{"id":"cognition-uncertainty","name":"拥抱不确定性"},{"id":"cognition-growth","name":"成长型思维"},{"id":"cognition-agency","name":"主体思维"},{"id":"cognition-action","name":"行动引领思考"},{"id":"cognition-learning","name":"向有成果的人学习"}]},{"id":"environment","title":"环境","note":"过去的自己，也和过去的环境有关","html":"\n              <span class=\"note-index\">02 / 环境</span><h2>过去的自己，也和过去的环境有关</h2>\n              <section class=\"note-subsection\" id=\"environment-scope\" aria-labelledby=\"environment-scope-title\">\n                <h3 id=\"environment-scope-title\">环境包括什么</h3>\n                <p>环境可以是物理的。身边放着一大袋零食，就会想吃；房间太乱，就会心烦。</p>\n                <p>也可以是一本书。读过《刻意练习》，会更相信人可以成长。</p>\n                <p>也可以是身边和网络上的人。室友考研，自己也更可能考研；室友喜欢游戏，自己也更可能喜欢游戏。朋友会乐器，会想学；朋友会跳舞，也会想试试。</p>\n              </section>\n              <section class=\"note-subsection\" id=\"environment-experience\" aria-labelledby=\"environment-experience-title\">\n                <h3 id=\"environment-experience-title\">没做过，不一定是不喜欢</h3>\n                <p>钱不够的时候，付费社交、穿搭、自我投资，很多事可能根本不在考虑范围里。时间、机会、身边有没有人一起，也都影响能接触到什么。</p>\n                <p>没尝试过，和尝试以后发现不喜欢，是两回事。以前觉得自己不需要、不在意的东西，也可能只是当时没有条件接触。</p>\n                <p>环境不仅影响能做什么，也影响拿什么经历来认识自己。</p>\n              </section>\n              <section class=\"note-subsection\" id=\"environment-people\" aria-labelledby=\"environment-people-title\">\n                <h3 id=\"environment-people-title\">换一群人，能看见不同的路</h3>\n                <p>大学时，周围有准备考公考研的同学，也看到了已经获得游戏实习的同学。游戏行业原来已经有人进去了，这条路就在身边。</p>\n                <p>后来减少了和方向不同的同学的接触，开始走自己的路。接触什么人、看到什么信息，会影响觉得什么事情是可能的。</p>\n                <p>环境还会影响表现出来的样子。在熟悉的人面前话很多，在陌生人面前沉默，可能和安全感、有没有共同话题有关。换一群人，表现也可能不一样。</p>\n                <p>过去的行为发生在过去的环境里，不能只凭这些就把自己定死。</p>\n              </section>\n              <section class=\"note-subsection\" id=\"environment-performance\" aria-labelledby=\"environment-performance-title\">\n                <h3 id=\"environment-performance-title\">一次表现，说明不了全部</h3>\n                <p>在一个团队里做得不好，可能有能力和经验的问题，也可能和任务、协作方式、资源有关。换个环境不一定全解决，留下来继续努力也不一定都能解决。</p>\n                <p>工作里具体哪件事不会做，什么地方没沟通好，哪些条件一直缺着，得分开看。直接归成“我能力不行”，或者全归成“环境太差”，很多东西就看不见了。</p>\n                <p>提升自己和寻找合适的环境，可以同时考虑。不用先把当前环境里的所有问题都解决，才有资格想别的可能。</p>\n              </section>\n              <section class=\"note-subsection\" id=\"environment-social\" aria-labelledby=\"environment-social-title\">\n                <h3 id=\"environment-social-title\">最近的社交尝试</h3>\n                <p>想要什么，选择或改变环境很重要。</p>\n                <p>我不擅长社交，所以现在开始更多地展示自己，参加活动。</p>\n                <p>这四个月，除了一个人探店、观展，还参加了三次陌生人聚餐、多次桌游、两次徒步爬山，跟别人去了一次动物园，试了一次简单的 cos。只用周末，就做了不少以前没试过的事。</p>\n                <p>做这个网站，也是想让更多人认识我，认识些学校和工作以外的人。</p>\n              </section>\n            ","chapters":[{"id":"environment-scope","name":"环境包括什么"},{"id":"environment-experience","name":"没做过，不一定是不喜欢"},{"id":"environment-people","name":"换一群人，能看见不同的路"},{"id":"environment-performance","name":"一次表现，说明不了全部"},{"id":"environment-social","name":"最近的社交尝试"}]},{"id":"home","title":"房子","note":"想住在什么样的地方","html":"\n              <span class=\"note-index\">03 / 房子</span><h2>想住在什么样的地方</h2>\n              <p>住过这些地方，现在比较在意阳光、卫生和自己的空间。但一个人住久了，也会想有人陪。</p>\n              <section class=\"note-subsection\" id=\"home-childhood\" aria-labelledby=\"home-childhood-title\">\n                <h3 id=\"home-childhood-title\">小时候的平房</h3>\n                <p>小时候住在很大的平房里，爷爷奶奶也一起住。外面有菜园，远一点有池塘和玩耍的地方，邻居家的几个孩子可以一起玩。</p>\n                <p>活动空间大，也自由，还能养猫。家里人挤在一起，但很温馨。</p>\n              </section>\n              <section class=\"note-subsection\" id=\"home-family\" aria-labelledby=\"home-family-title\">\n                <h3 id=\"home-family-title\">后来的两个家</h3>\n                <p>上小学时，平房拆迁了。算上家里买的一套房，一共有两套。</p>\n                <p>住得最久的是六楼那套，从小学一年级一直到后来高中、大学住宿。小时候爬楼不算太辛苦。外面能玩的地方少了，但住起来比平房舒服。</p>\n                <p>家里三个孩子，我和哥哥一个房间，能一起玩游戏，但有时候没什么隐私。</p>\n                <p>隔一面墙就是学校，早上有时很吵，但看着学生的样子，又觉得很有能量。这是我记忆最多的家。</p>\n                <p>另一套在二楼，主要是爷爷奶奶住，空间比较开阔。经常有亲戚串门，玩电脑也不会有我妈在旁边给压力。不过亲戚偶尔见见还好，总是接触，也不是很喜欢。</p>\n              </section>\n              <section class=\"note-subsection\" id=\"home-dormitory\" aria-labelledby=\"home-dormitory-title\">\n                <h3 id=\"home-dormitory-title\">高中和大学宿舍</h3>\n                <p>高中宿舍条件一般。集体生活压力比较大，没自己的空间。不过能约人跑步、打羽毛球、去图书馆，也有一些有趣的事。</p>\n                <p>大学宿舍也差不多，住得舒不舒服，很看室友。高中大家主要学习、运动，大学更自由，但有些室友晚上很吵，也不爱卫生。吐槽一下，大学四年的厕所基本都是我在洗。</p>\n              </section>\n              <section class=\"note-subsection\" id=\"home-renting\" aria-labelledby=\"home-renting-title\">\n                <h3 id=\"home-renting-title\">两次租房</h3>\n                <p>第一次租在城中村，住了五个月。第一次租房没注意采光，虽然早上一般不在家，但还是不喜欢屋里太暗。</p>\n                <p>刚开始一个人住还好，后来会孤独，尤其生病没人照顾的时候。有时听到楼下情侣说话，还会有点羡慕。</p>\n                <p>现在的房子阳光很足，也有地方养花。一个人住很自由，但很多时候太安静，反而更觉得孤独。</p>\n              </section>\n            ","chapters":[{"id":"home-childhood","name":"小时候的平房"},{"id":"home-family","name":"后来的两个家"},{"id":"home-dormitory","name":"高中和大学宿舍"},{"id":"home-renting","name":"两次租房"}]},{"id":"work","title":"工作","note":"游戏策划、做家教","html":"\n              <span class=\"note-index\">04 / 工作</span><h2>工作</h2>\n              <section class=\"note-subsection\" id=\"work-game-planning\" aria-labelledby=\"work-game-planning-title\">\n                <h3 id=\"work-game-planning-title\">游戏策划</h3>\n                <p>现在做游戏策划，日常要写活动、系统策划案，配表，提人物皮肤美术需求、技能特效需求。也有很多时间在和不同岗位的人沟通、开会。</p>\n                <p>比较喜欢人物美术和技能特效需求这部分。可以从以前喜欢的作品里找灵感，还挺爽的。</p>\n                <p>工作后也犯过一些错，特别是需要别人帮我善后的时候，会比较难受。</p>\n                <p>不喜欢的地方也有，有些可能和环境有关。这里可能会被熟人看到，就不展开了。感兴趣可以直接找我聊。</p>\n                <p>以后也想找机会做副业。</p>\n              </section>\n              <section class=\"note-subsection\" id=\"work-tutoring\" aria-labelledby=\"work-tutoring-title\">\n                <h3 id=\"work-tutoring-title\">做家教</h3>\n                <p>大二想赚点钱，去做了家教。教一个初一男生数学，一小时 60 元，周末教两小时。</p>\n                <p>人挺乖的，但教起来没那么容易。把题拆得很细，也试过类比这些方法，还是没能很好地教会他。当时讲完会做，过几十分钟又不会了。现在回头看，应该还可以多试些教法。</p>\n                <p>后来生病，又赶上期末，就匆忙结束了。觉得自己以后应该不会当老师，也就没想着继续做家教。算是一次不错的经历。</p>\n              </section>\n              <div class=\"text-links\"><button type=\"button\" class=\"rye-text-link\" data-topic=\"1\" data-chapter=\"experience\">环境如何影响尝试？ <span aria-hidden=\"true\">↗</span></button></div>\n            ","chapters":[{"id":"work-game-planning","name":"游戏策划"},{"id":"work-tutoring","name":"做家教"}]},{"id":"relationship","title":"恋爱关系","note":"想法与改变","html":"\n              <span class=\"note-index\">05 / 恋爱关系</span><h2>恋爱</h2>\n              <p>工作以前很少想谈恋爱。升学、找工作，加上自己的兴趣，已经挺充实了。工作稳定些以后，加上生病时的孤独感，才开始想认识一个特别的人。到现在四个多月。</p>\n              <p>我的恋爱观比较理想，也比较纯爱。但容易考虑太多，还没怎么相处，就先有了很多判断和结论。现在也在学怎么和女生自然相处、倾听，保持自己的主体性，提高自己的价值。</p>\n              <p>以前不怎么发朋友圈，担心隐私、被比较。但不展示，别人也少了一个了解我的机会。现在开始每周分享一些生活。</p>\n              <p>也发现自己会喜欢好看一些的女生，所以自己也开始健身，研究穿搭、发型。还没到满意的状态，但有在改变。</p>\n              <p>和不同的人交流后，原来的一些想法变了。没有完全认同别人的看法，但确实很有价值。</p>\n              <p>到现在有遇到过有好感的女生，但还没谈上恋爱。或许四个多月还太短，还有好多东西要学。具体经历不在这里写，想聊的可以联系我。</p>\n            ","chapters":[]}];
 const interests=[{"label":"番剧","heading":"最喜欢的一些番剧","items":["物语系列","CLANNAD","心理测量者","狼与香辛料","反叛的鲁路修","轻音少女","排球少年","三月的狮子","来自深渊","暗杀教室","FLCL（特别的她）","葬送的芙莉莲","血界战线","冰菓","龙与虎","宝石之国","漂流少年","Angel Beats!","xxxHOLiC"]},{"label":"游戏","heading":"玩过的一部分游戏","items":["八方旅人","最终幻想7","女神异闻录5","鸣潮","英雄联盟","杀戮尖塔"]},{"label":"电影","heading":"喜欢、也推荐的电影","items":["海上钢琴师","怦然心动","黑天鹅","银翼杀手","天堂电影院","天使爱美丽","飞越疯人院","死亡诗社","爱乐之城","楚门的世界"]},{"label":"书","heading":"提到过的两本书","items":["麦田里的守望者","伟大为什么不能被计划"]},{"label":"待探索","heading":"还想试试什么","items":[]}];
 const aboutMarkup="<section class=\"rye-about-part\"><span class=\"rye-about-mark\">01</span>\n              <h3>开始走自己的路</h3>\n              <p>双非本科，读着并不热衷的软件工程，也担心未来的工作会被 AI 替代。后来，我开始改变<button type=\"button\" class=\"rye-text-link\" data-topic=\"0\">认知<span aria-hidden=\"true\">↗</span></button>和<button type=\"button\" class=\"rye-text-link\" data-topic=\"1\">环境<span aria-hidden=\"true\">↗</span></button>，朝游戏策划的方向行动，拿到了实习机会，如今已经转正。</p>\n            </section><section class=\"rye-about-part\"><span class=\"rye-about-mark\">02</span>\n              <h3>重新认识自己<small>Know Yourself</small></h3>\n              <p>我是真的不喜欢，还是还没试过？为了重新找回幸福感，我开始走出去，认识不同的人，也重新探索自己想住的<button type=\"button\" class=\"rye-text-link\" data-topic=\"2\">房子<span aria-hidden=\"true\">↗</span></button>、想做的<button type=\"button\" class=\"rye-text-link\" data-topic=\"3\">工作<span aria-hidden=\"true\">↗</span></button>和期待的<button type=\"button\" class=\"rye-text-link\" data-topic=\"4\">恋爱关系<span aria-hidden=\"true\">↗</span></button>。有些答案，我想在生活里慢慢找到。</p>\n            </section><section class=\"rye-about-part\"><span class=\"rye-about-mark\">03</span>\n              <h3>也想和你聊聊喜欢的作品</h3>\n              <p>电影、番剧、音乐、游戏和书，占据了我不少空闲时间。如果你也喜欢其中的某部作品，我们或许就有了聊天的开场。</p>\n              \n            <button type=\"button\" class=\"rye-inline-nav\" data-section=\"2\">看看我的兴趣 ↗</button></section>";

 function renderArticle(index){
  chapterObserver?.disconnect();currentTopic=index;content.classList.add('is-reading');root.classList.add('is-reading-view');
  const t=topics[index],hasChapters=t.chapters.length>1;
  content.innerHTML='<div class="rye-article-actions"><button type="button" class="rye-topic-back"><span class="rye-return-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M26 16H6m10-10L6 16l10 10"/></svg></span><span>'+(topicTrail.length?'返回上一篇':selected===0?'返回自我介绍':'返回主题目录')+'</span></button><button type="button" class="rye-all-topics">全部主题 ↗</button></div><div class="rye-reading-layout">'+(hasChapters?'<details class="rye-chapter-menu"'+(root.clientWidth>=800?' open':'')+'><summary>本篇目录 · '+t.chapters.length+' 节</summary><nav aria-label="本篇目录">'+t.chapters.map(c=>'<a href="#'+c.id+'" data-jump="'+c.id+'">'+c.name+'</a>').join('')+'</nav></details>':'')+'<article class="rye-reading-article">'+t.html+'</article></div>';
  if(hasChapters){chapterObserver=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top)[0];if(visible)content.querySelectorAll('[data-jump]').forEach(a=>{if(a.dataset.jump===visible.target.id)a.setAttribute('aria-current','location');else a.removeAttribute('aria-current');});},{rootMargin:'-5% 0px -55% 0px'});content.querySelectorAll('.note-subsection').forEach(el=>chapterObserver.observe(el));}
 }
 function showTopic(index,origin,chapter){
  if(currentTopic!==null)topicTrail.push({index:currentTopic,origin});
  else topicOrigin=origin;
  renderArticle(index);pageEntrance();content.querySelector('.rye-topic-back').focus();
  if(chapter)content.querySelector('[id="'+topics[index].id+'-'+chapter+'"]')?.scrollIntoView({block:'start'});
 }
 function returnTopic(){
  if(topicTrail.length){const previous=topicTrail.pop();renderArticle(previous.index);pageEntrance();content.querySelector('[data-topic="'+previous.origin+'"]')?.focus();return;}
  const restore=topicOrigin;renderSection(selected);pageEntrance();content.querySelector('[data-topic="'+restore+'"]')?.focus();
 }
 content.addEventListener('click',e=>{
  const trigger=e.target.closest('[data-topic]');if(trigger){showTopic(Number(trigger.dataset.topic),trigger.dataset.topic,trigger.dataset.chapter);return;}
  if(e.target.closest('.rye-topic-back')){returnTopic();return;}
  if(e.target.closest('.rye-all-topics')){selected=1;renderSection(1);pageEntrance();content.querySelector('.rye-topic')?.focus();return;}
  const interestButton=e.target.closest('[data-interest]');if(interestButton){activeInterest=Number(interestButton.dataset.interest);renderInterests();content.querySelector('[data-interest="'+activeInterest+'"]').focus({preventScroll:true});return;}
  const jump=e.target.closest('[data-jump]');if(jump){e.preventDefault();const target=content.querySelector('[id="'+jump.dataset.jump+'"]');if(root.clientWidth<800)content.querySelector('.rye-chapter-menu').open=false;target?.scrollIntoView({block:'start',behavior:'auto'});return;}
  const sectionButton=e.target.closest('[data-section]');if(sectionButton){selected=Number(sectionButton.dataset.section);renderSection(selected);pageEntrance();root.querySelector('.rye-back').focus();}
 });
 root.addEventListener('keydown',e=>{if(e.key==='Escape'&&!destination.hidden&&!busy){e.preventDefault();const back=content.querySelector('.rye-topic-back');if(back)back.click();else backToMenu();}});
 function setMotion(on){motion=on&&!reduced.matches;root.classList.toggle('is-still',!motion);root.classList.toggle('is-ambient',motion);motionButton.setAttribute('aria-pressed',String(motion));motionButton.textContent=motion?'动效 ON':'动效 OFF';}
 motionButton.addEventListener('click',()=>setMotion(!motion));reduced.addEventListener('change',()=>setMotion(!reduced.matches));
 function entrance(){clearTimeout(introTimer);root.classList.remove('is-entering');requestAnimationFrame(()=>{root.classList.add('is-entering');introTimer=setTimeout(()=>root.classList.remove('is-entering'),1100)})}
 root.querySelector('.rye-replay').addEventListener('click',()=>{if(busy)return;if(!menu.hidden)entrance();else pageEntrance();});setMotion(motion);entrance();
})();
</script>
<script>
(()=>{
 const root=document.getElementById('rye-motion'),stage=root.querySelector('.rye-stage'),sound=root.querySelector('.rye-sound');
 const disc=sound.querySelector('.rye-sound-disc'),options=sound.querySelector('.rye-sound-options'),caption=sound.querySelector('.rye-sound-caption strong'),modes=[...sound.querySelectorAll('.rye-sound-mode')];
 const names={vocal:'人间电台',instrumental:'无词漫游'};
 let kind='vocal',position={x:24,y:575},moved=false,hovered=false,keyboard=false,keyNavigation=false,latched=false,opened=false,drag=null,skipClickUntil=0,closeTimer,switchTimer,saved=null;
 const fine=()=>matchMedia('(hover:hover) and (pointer:fine)').matches;
 function setOpen(value){opened=value;sound.classList.toggle('is-open',value);options.inert=!value;options.setAttribute('aria-hidden',String(!value));disc.setAttribute('aria-expanded',String(value));}
 function sync(){setOpen(!drag?.active&&(hovered||keyboard||latched));}
 function close(){clearTimeout(closeTimer);hovered=false;keyboard=false;latched=false;setOpen(false);}
 function place(x,y){position={x:Math.max(12,Math.min(x,stage.clientWidth-60)),y:Math.max(12,Math.min(y,stage.clientHeight-60))};sound.style.left=position.x+'px';sound.style.top=position.y+'px';sound.classList.toggle('opens-left',position.x>stage.clientWidth-176);sound.classList.toggle('opens-down',position.y<110);}
 function home(){return root.clientWidth<=540?{x:20,y:224}:{x:24,y:stage.clientHeight-74};}
 sound.addEventListener('pointerenter',e=>{if(e.pointerType==='touch'||!fine())return;clearTimeout(closeTimer);hovered=true;sync();});
 sound.addEventListener('pointerleave',()=>{clearTimeout(closeTimer);closeTimer=setTimeout(()=>{hovered=false;sync();},220);});
 sound.addEventListener('focusin',()=>{if(keyNavigation){keyboard=true;sync();}});
 sound.addEventListener('focusout',()=>{queueMicrotask(()=>{if(!sound.contains(document.activeElement)){keyboard=false;sync();}});});
 disc.addEventListener('click',()=>{if(performance.now()<skipClickUntil)return;latched=!latched;if(!latched)hovered=false;sync();});
 function select(next){if(next===kind)return;kind=next;sound.dataset.kind=kind;caption.textContent=names[kind];modes.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.kind===kind)));clearTimeout(switchTimer);sound.classList.remove('is-switching');requestAnimationFrame(()=>{sound.classList.add('is-switching');switchTimer=setTimeout(()=>sound.classList.remove('is-switching'),260);});}
 modes.forEach((b,i)=>{b.addEventListener('click',()=>select(b.dataset.kind));b.addEventListener('pointerenter',()=>caption.textContent=names[b.dataset.kind]);b.addEventListener('pointerleave',()=>caption.textContent=names[kind]);b.addEventListener('focus',()=>caption.textContent=names[b.dataset.kind]);b.addEventListener('blur',()=>caption.textContent=names[kind]);b.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();modes[1-i].focus();}});});
 function begin(id,x,y){clearTimeout(closeTimer);drag={id,startX:x,startY:y,x:position.x,y:position.y,active:false};}
 function move(id,x,y){if(!drag||drag.id!==id)return;const dx=x-drag.startX,dy=y-drag.startY;if(!drag.active&&Math.hypot(dx,dy)<5)return;drag.active=true;moved=true;setOpen(false);sound.classList.add('is-dragging');place(drag.x+dx,drag.y+dy);}
 function end(id){if(!drag||drag.id!==id)return;const active=drag.active;drag=null;sound.classList.remove('is-dragging');if(typeof id==='number'&&disc.hasPointerCapture(id))disc.releasePointerCapture(id);if(active){skipClickUntil=performance.now()+350;close();}}
 disc.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'||e.button!==0||!e.isPrimary)return;begin(e.pointerId,e.clientX,e.clientY);disc.setPointerCapture(e.pointerId);});
 disc.addEventListener('pointermove',e=>move(e.pointerId,e.clientX,e.clientY));
 disc.addEventListener('pointerup',e=>end(e.pointerId));disc.addEventListener('pointercancel',e=>end(e.pointerId));
 disc.addEventListener('lostpointercapture',()=>{if(drag){drag=null;sound.classList.remove('is-dragging');close();}});
 disc.addEventListener('mousedown',e=>{if(e.button!==0)return;e.preventDefault();begin('mouse',e.clientX,e.clientY);});
 document.addEventListener('mousemove',e=>{if(drag?.id==='mouse'){if(!(e.buttons&1)){end('mouse');return;}move('mouse',e.clientX,e.clientY);}});
 document.addEventListener('mouseup',()=>end('mouse'));window.addEventListener('blur',()=>{if(drag)end(drag.id);close();});
 disc.addEventListener('keydown',e=>{const step=e.shiftKey?36:12,moves={ArrowLeft:[-step,0],ArrowRight:[step,0],ArrowUp:[0,-step],ArrowDown:[0,step]};if(e.key==='Home'){e.preventDefault();moved=false;const p=home();place(p.x,p.y);}else if(moves[e.key]){e.preventDefault();moved=true;place(position.x+moves[e.key][0],position.y+moves[e.key][1]);}});
 sound.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();disc.focus({preventScroll:true});close();}else if(e.key!=='Enter'&&e.key!==' '){keyNavigation=true;keyboard=true;sync();}});
 document.addEventListener('keydown',e=>{if(e.key==='Tab')keyNavigation=true;},true);
 document.addEventListener('pointerdown',e=>{keyNavigation=false;keyboard=false;if(!sound.contains(e.target))close();},true);
 root.addEventListener('rye-viewchange',e=>{close();if(e.detail==='section'){saved={position:{...position},moved};place(stage.clientWidth-68,24);}else if(saved){moved=saved.moved;place(saved.position.x,saved.position.y);saved=null;}});
 new ResizeObserver(()=>{if(root.clientWidth<1)return;if(root.dataset.view==='section')place(stage.clientWidth-68,24);else if(moved)place(position.x,position.y);else{const p=home();place(p.x,p.y);}}).observe(stage);
})();
</script>
